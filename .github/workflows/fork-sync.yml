name: Fork sync

on:
  schedule:
    - cron: "30 4 * * *" # after the 03:45 UTC server nightly tag
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: push nothing"
        type: boolean
        default: false

concurrency:
  group: fork-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out the sync script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: tools

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.8.0

      - name: Use Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.x"

      - name: Clone the fork
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          test -n "$SYNC_TOKEN" || { echo "::error::Add the SYNC_TOKEN repository secret"; exit 1; }
          git clone -q "https://x-access-token:${SYNC_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
          git -C repo remote add upstream https://github.com/music-assistant/frontend.git

      - name: Sync
        id: sync
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CI: true
        run: |
          python3 tools/fork_sync.py --config tools/fork-sync.json --repo-dir repo \
            ${{ inputs.dry_run && '--dry-run' || '' }}
